name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  codebase-memory-python39:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Codebase memory cache tests
        run: python -m unittest -v tests/codebase_memory_cache_test.py

  validate-and-publish-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - name: Install validators
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pre-commit
          npm install --global skills-ref@0.1.5

      - name: CI checks
        run: make ci

      - name: Changed skills
        run: |
          echo "Changed skills against origin/main:"
          ./scripts/changed_skills.sh origin/main HEAD || true
